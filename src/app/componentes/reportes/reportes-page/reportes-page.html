    <div class="p-6">
      <h1 class="text-2xl font-bold mb-4">Página de Reportes</h1>

      <!-- Filtro rápido -->
      <div class="mb-4">
        <button (click)="filterData('all')" class="mr-2 px-3 py-1 bg-gray-200 rounded">Todos</button>
        <button (click)="filterData('high')" class="px-3 py-1 bg-blue-500 text-white rounded">Monto > 500</button>
      </div>

      <!-- Resumen reactivo -->
      <div class="p-4 bg-gray-100 rounded mb-4">
        <p>Total de registros: {{ totalCount() }}</p>
        <p>Suma total: $ {{ totalSum() }}</p>
      </div>

      <!-- Tabla de datos -->
      <table class="w-full border-collapse border border-gray-300">


        <thead>
          <tr class="bg-gray-200">
            <th class="border border-gray-300 p-2">ID</th>
            <th class="border border-gray-300 p-2">Nombre</th>
            <th class="border border-gray-300 p-2">Monto</th>
            <th class="border border-gray-300 p-2">Fecha</th>
          </tr>
        </thead>
        <tbody>
          @for (item of filteredReports(); track item.id) {
            <tr>
              <td class="border border-gray-300 p-2 text-center">{{ item.id }}</td>
              <td class="border border-gray-300 p-2">{{ item.name }}</td>
              <td class="border border-gray-300 p-2 text-right">$ {{ item.amount }}</td>
              <td class="border border-gray-300 p-2 text-center">{{ item.date }}</td>
            </tr>
          }
